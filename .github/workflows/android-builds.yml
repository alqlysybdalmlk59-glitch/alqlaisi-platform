name: Android builds

on:
  push:
    branches:
      - main
    paths:
      - "android/**"
      - "app/**"
      - "lib/**"
      - "test/**"
      - "seller_app/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradle.properties"
      - ".github/workflows/android-builds.yml"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  customer-flutter:
    name: Customer Flutter Android build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.4"
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze customer app
        run: flutter analyze
      - name: Run customer tests
        run: flutter test
      - name: Build Android debug APK
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://10.0.2.2:8000/api
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: alqlaisi-customer-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  native-android:
    name: Native Android Studio app build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          test -x "$SDKMANAGER"
          set +e
          yes | "$SDKMANAGER" --licenses
          LICENSE_STATUS=${PIPESTATUS[1]}
          set -e
          test "$LICENSE_STATUS" -eq 0
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Configure local Android SDK path
        shell: bash
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - name: Build native Android app
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug
      - name: Upload native APK
        uses: actions/upload-artifact@v4
        with:
          name: alqlaisi-native-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
