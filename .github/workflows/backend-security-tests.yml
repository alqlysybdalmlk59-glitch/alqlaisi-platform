name: Backend security tests

on:
  push:
    branches:
      - main
      - audit/backend-foundation-fixes
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  security-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend Python files
        run: python -m compileall -q backend
      - name: Smoke-test unified FastAPI entry point
        env:
          JWT_SECRET_KEY: test-only-secret-not-for-production-0123456789
        run: python -c "from backend.app.main import app; paths = app.openapi()['paths']; print('OpenAPI paths:', sorted(paths)); assert '/auth/login' in paths, 'Missing auth login route'; assert '/auth/google' in paths, 'Missing Google login route'; assert '/api/v1/health' in paths, 'Missing versioned health route'; print('Unified FastAPI entry point loaded')"
      - name: Run security unit tests
        env:
          JWT_SECRET_KEY: test-only-secret-not-for-production-0123456789
        run: python -m unittest backend.test_access_control -v
      - name: Run authentication API integration tests
        env:
          JWT_SECRET_KEY: test-only-secret-not-for-production-0123456789
        run: python -m unittest backend.test_auth_api -v
